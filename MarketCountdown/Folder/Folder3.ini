[Rainmeter]
Update=1000

@Include=#@#VariablesDefault.inc
@Include=#@#Variables.inc
@Include=#@#VariablesData.inc
@Include=FolderConfig.inc

[MeasureSydneyTime]
Measure=Time
TimeZone=AUS Eastern Standard Time
Format=%H:%M
UpdateDivider=1

[MeasureSydneyTime24]
Measure=Time
TimeZone=AUS Eastern Standard Time
Format=%H:%M
UpdateDivider=1

[MeasureSydneyTime12]
Measure=Time
TimeZone=AUS Eastern Standard Time
Format=%I:%M %p
UpdateDivider=1

[MeasureSydneyHours]
Measure=String
String=07:00–16:00

[MeasureSydneyStatus]
Measure=Script
ScriptFile=#@#Scripts/MarketStatus.lua
MarketName=Sydney
MarketTimeZone=AUS Eastern Standard Time
MarketOpen1=07:00
MarketClose1=16:00
UpdateDivider=1

[MeasureSydneyDisplay]
Measure=Script
ScriptFile=#@#Scripts/MarketDisplay.lua
MarketName=Sydney
MarketTimeZone=AUS Eastern Standard Time
MarketOpen1=07:00
MarketClose1=16:00
UpdateDivider=1

[MeasureSydneyProgress]
Measure=Script
ScriptFile=#@#Scripts/MarketProgress.lua
MarketName=Sydney
MarketTimeZone=AUS Eastern Standard Time
MarketOpen1=07:00
MarketClose1=16:00
UpdateDivider=1

; Number of items
#NumberOfItems#=5

; Item names
ItemName1=Status: [MeasureSydneyStatus]
ItemName2=Time: [MeasureSydneyTime]
ItemName3=Hours: 07:00–16:00
ItemName4=Next Open: [MeasureSydneyDisplay]
ItemName5=Progress: [MeasureSydneyProgress]%

; Make items non-clickable (display only)
ItemIsClickable1=0
ItemIsClickable2=0
ItemIsClickable3=0
ItemIsClickable4=0
ItemIsClickable5=0

; Background
BGColor=40,40,40,200

; Fonts
FontName=Segoe UI
FontSize=11
FontColor=255,255,255
