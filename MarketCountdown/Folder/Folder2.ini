[Rainmeter]
Update=1000

@Include=#@#VariablesDefault.inc
@Include=#@#Variables.inc
@Include=#@#VariablesData.inc
@Include=FolderConfig.inc

[MeasureNewYorkTime]
Measure=Time
TimeZone=Eastern Standard Time
Format=%H:%M
UpdateDivider=1

[MeasureNewYorkTime24]
Measure=Time
TimeZone=Eastern Standard Time
Format=%H:%M
UpdateDivider=1

[MeasureNewYorkTime12]
Measure=Time
TimeZone=Eastern Standard Time
Format=%I:%M %p
UpdateDivider=1

[MeasureNewYorkHours]
Measure=String
String=08:00–17:00

[MeasureNewYorkStatus]
Measure=Script
ScriptFile=#@#Scripts/MarketStatus.lua
MarketName=NewYork
MarketTimeZone=Eastern Standard Time
MarketOpen1=08:00
MarketClose1=17:00
UpdateDivider=1

[MeasureNewYorkDisplay]
Measure=Script
ScriptFile=#@#Scripts/MarketDisplay.lua
MarketName=NewYork
MarketTimeZone=Eastern Standard Time
MarketOpen1=08:00
MarketClose1=17:00
UpdateDivider=1

[MeasureNewYorkProgress]
Measure=Script
ScriptFile=#@#Scripts/MarketProgress.lua
MarketName=NewYork
MarketTimeZone=Eastern Standard Time
MarketOpen1=08:00
MarketClose1=17:00
UpdateDivider=1

; Number of items
#NumberOfItems#=5

; Item names
ItemName1=Status: [MeasureNewYorkStatus]
ItemName2=Time: [MeasureNewYorkTime]
ItemName3=Hours: 08:00–17:00
ItemName4=Next Open: [MeasureNewYorkDisplay]
ItemName5=Progress: [MeasureNewYorkProgress]%

; Make items non-clickable (display only)
ItemIsClickable1=0
ItemIsClickable2=0
ItemIsClickable3=0
ItemIsClickable4=0
ItemIsClickable5=0

; Background
BGColor=40,40,40,200

; Fonts
FontName=Segoe UI
FontSize=11
FontColor=255,255,255
