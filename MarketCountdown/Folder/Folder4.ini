[Rainmeter]
Update=1000

@Include=#@#VariablesDefault.inc
@Include=#@#Variables.inc
@Include=#@#VariablesData.inc
@Include=FolderConfig.inc

[MeasureTokyoTime]
Measure=Time
TimeZone=Tokyo Standard Time
Format=%H:%M
UpdateDivider=1

[MeasureTokyoTime24]
Measure=Time
TimeZone=Tokyo Standard Time
Format=%H:%M
UpdateDivider=1

[MeasureTokyoTime12]
Measure=Time
TimeZone=Tokyo Standard Time
Format=%I:%M %p
UpdateDivider=1

[MeasureTokyoHours]
Measure=String
String=09:00–11:30`n12:30–15:30

[MeasureTokyoStatus]
Measure=Script
ScriptFile=#@#Scripts/MarketStatus.lua
MarketName=Tokyo
MarketTimeZone=Tokyo Standard Time
MarketOpen1=09:00
MarketClose1=11:30
MarketOpen2=12:30
MarketClose2=15:30
UpdateDivider=1

[MeasureTokyoDisplay]
Measure=Script
ScriptFile=#@#Scripts/MarketDisplay.lua
MarketName=Tokyo
MarketTimeZone=Tokyo Standard Time
MarketOpen1=09:00
MarketClose1=11:30
MarketOpen2=12:30
MarketClose2=15:30
UpdateDivider=1

[MeasureTokyoProgress]
Measure=Script
ScriptFile=#@#Scripts/MarketProgress.lua
MarketName=Tokyo
MarketTimeZone=Tokyo Standard Time
MarketOpen1=09:00
MarketClose1=11:30
MarketOpen2=12:30
MarketClose2=15:30
UpdateDivider=1

; Number of items
#NumberOfItems#=5

; Item names
ItemName1=Status: [MeasureTokyoStatus]
ItemName2=Time: [MeasureTokyoTime]
ItemName3=Hours: 09:00–11:30 / 12:30–15:30
ItemName4=Next Open: [MeasureTokyoDisplay]
ItemName5=Progress: [MeasureTokyoProgress]%

; Make items non-clickable (display only)
ItemIsClickable1=0
ItemIsClickable2=0
ItemIsClickable3=0
ItemIsClickable4=0
ItemIsClickable5=0

; Background
BGColor=40,40,40,200

; Fonts
FontName=Segoe UI
FontSize=11
FontColor=255,255,255
