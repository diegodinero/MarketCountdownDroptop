[Rainmeter]
Update=1000

@Include=#@#VariablesDefault.inc
@Include=#@#Variables.inc
@Include=#@#VariablesData.inc
@Include=FolderConfig.inc

[MeasureLondonTime]
Measure=Time
TimeZone=GMT Standard Time
Format=%H:%M
UpdateDivider=1

[MeasureLondonTime24]
Measure=Time
TimeZone=GMT Standard Time
Format=%H:%M
UpdateDivider=1

[MeasureLondonTime12]
Measure=Time
TimeZone=GMT Standard Time
Format=%I:%M %p
UpdateDivider=1

[MeasureLondonHours]
Measure=String
String=08:00–17:00

[MeasureLondonStatus]
Measure=Script
ScriptFile=#@#Scripts/MarketStatus.lua
MarketName=London
MarketTimeZone=GMT Standard Time
MarketOpen1=08:00
MarketClose1=17:00
UpdateDivider=1

[MeasureLondonDisplay]
Measure=Script
ScriptFile=#@#Scripts/MarketDisplay.lua
MarketName=London
MarketTimeZone=GMT Standard Time
MarketOpen1=08:00
MarketClose1=17:00
UpdateDivider=1

[MeasureLondonProgress]
Measure=Script
ScriptFile=#@#Scripts/MarketProgress.lua
MarketName=London
MarketTimeZone=GMT Standard Time
MarketOpen1=08:00
MarketClose1=17:00
UpdateDivider=1

; Number of items (4 items per market)
#NumberOfItems#=5

; Item names
ItemName1=Status: [MeasureLondonStatus]
ItemName2=Time: [MeasureLondonTime]
ItemName3=Hours: 08:00–17:00
ItemName4=Next Open: [MeasureLondonDisplay]
ItemName5=Progress: [MeasureLondonProgress]%

; Make items non-clickable (display only)
ItemIsClickable1=0
ItemIsClickable2=0
ItemIsClickable3=0
ItemIsClickable4=0
ItemIsClickable5=0

; Background
BGColor=40,40,40,200

; Fonts
FontName=Segoe UI
FontSize=11
FontColor=255,255,255
