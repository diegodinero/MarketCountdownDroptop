[Rainmeter]
Update=1000
DynamicWindowSize=1
AccurateText=1

@Include=#@#VariablesDefault.inc
@Include=#@#Variables.inc
@Include=#@#VariablesData.inc
@Include=MainConfig.inc

[MeasureLondonTime]
Measure=Time
TimeZone=GMT Standard Time
Format=%H:%M
UpdateDivider=1

[MeasureLondonStatus]
Measure=Script
ScriptFile=#@#Scripts/MarketStatus.lua
MarketName=London
MarketTimeZone=GMT Standard Time
MarketOpen1=08:00
MarketClose1=17:00
UpdateDivider=1

[MeasureNewYorkTime]
Measure=Time
TimeZone=Eastern Standard Time
Format=%H:%M
UpdateDivider=1

[MeasureNewYorkStatus]
Measure=Script
ScriptFile=#@#Scripts/MarketStatus.lua
MarketName=NewYork
MarketTimeZone=Eastern Standard Time
MarketOpen1=08:00
MarketClose1=17:00
UpdateDivider=1

[MeasureSydneyTime]
Measure=Time
TimeZone=AUS Eastern Standard Time
Format=%H:%M
UpdateDivider=1

[MeasureSydneyStatus]
Measure=Script
ScriptFile=#@#Scripts/MarketStatus.lua
MarketName=Sydney
MarketTimeZone=AUS Eastern Standard Time
MarketOpen1=07:00
MarketClose1=16:00
UpdateDivider=1

[MeasureTokyoTime]
Measure=Time
TimeZone=Tokyo Standard Time
Format=%H:%M
UpdateDivider=1

[MeasureTokyoStatus]
Measure=Script
ScriptFile=#@#Scripts/MarketStatus.lua
MarketName=Tokyo
MarketTimeZone=Tokyo Standard Time
MarketOpen1=09:00
MarketClose1=11:30
MarketOpen2=12:30
MarketClose2=15:30
UpdateDivider=1

[MeasureTodayDate]
Measure=Time
Format=%d %b
UpdateDivider=3600

[MeterLondon]
Meter=String
X=10
Y=10
W=280
H=60
FontFace=Segoe UI
FontSize=11
FontColor=255,255,255
Text=London`nLondon Time: [MeasureLondonTime]`nStatus: [MeasureLondonStatus]`nHours: 08:00–17:00
StringAlign=LeftTop
AntiAlias=1
